<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Explorer | Contact</title>
    <link rel="stylesheet" href="../static/css/header.css">
    <link rel="stylesheet" href="../static/css/contact.css">
    <script src="../static/js/main.js" defer></script>
</head>
<body>
    <header>
        <div class="brand">
            <h1>Recipe Explorer</h1>
            <a href="index.html"><img src="../static/images/placeholder.webp" alt="logo"></a>
        </div>
        <nav aria-label="Main">
            <a href="index.html" >Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="nutrition.html">Nutrition</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>

        <section id="team-details" class="page-section">
            <br>
            <br>
            <br>
        </section>


        <section class="contact-us">

            <form id="contact-form">
            <fieldset class="form-section">
                <legend>Contact Details</legend>
                <div class="form-row">

                    <div class="field">
                        <label>Name
                            <input type="text" id="name" minlength="5" maxlength="67" placeholder="Full name" required>
                        </label>
                    </div>

                    <div class="field">
                        <label>Email
                            <input type="email" id="email" placeholder="Email@example.com" required>
                        </label>
                    </div>

                    <div class="field">
                        <label>Subject
                            <select id="subject" required>
                                <option selected hidden disabled>Please select a reason.</option>
                                <option value="err">Recipe or Nutrition Error</option>
                                <option value="bug">Report a bug</option>
                                <option value="req">Feature Request</option>
                                <option value="acc">Account or login issue</option>
                                <option value="gen">General Feedback / Other</option>
                            </select>
                        </label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Personal Details</legend>
                <fieldset>
                    <legend>Gender</legend>
                    <div class="radio-options">
                        <label class="radio-option">
                            <input type="radio" id="gender-male" name="gender" value="m" required>
                            <span>Male</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" id="gender-female" name="gender" value="f">
                            <span>Female</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" id="gender-other" name="gender" value="o">
                            <span>Rather not say</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-row">
                    <div class="field">
                        <label>Weight (kg)
                            <input type="number" id="weight" name="weight" min="25" max="250" step="1" placeholder="67.9" required>
                        </label>
                    </div>
                    <div class="field">
                        <label>Height (cm)
                            <input type="number" id="height" name="height" min="100" max="250" step="1" placeholder="167" required>
                        </label>
                    </div>
                    <div class="field">
                        <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" name="dob" required>
                        <small class="error-msg" aria-live="polite"></small>
                    </div>
                </div>
            </fieldset>
            <fieldset class="form-section">
                <legend>Your Message</legend>
                <div class="field">
                    <label>Message
                        <textarea id="message" name="message" rows="5" minlength="10" maxlength="1000" placeholder="Tell us what happened and how we can help!" required></textarea>
                    </label>
                </div>
            </fieldset>
            <button type="submit" class="submit-btn">Submit form</button>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-contact">
                <p><a href="mailto:hello@recipeexplorer.example">hello@recipeexplorer.example</a></p>
                <p><a href="tel:+962000000000">+962 00 000 0000</a></p>
            </div>
            <div class="footer-social" aria-label="Social media">
                <p><a href="https://instagram.com">Socials</a></p>
                <p><a href="contact.html#reach-us">Location</a></p>
            </div>
            <p class="copyright"><small>&copy; 2026 Recipe Explorer. All rights reserved.</small></p>
        </div>
    </footer>
</body>
