<head>

            <h1>Recipe Explorer</h1>
            <a href="index.html"><img src="../static/images/placeholder.webp" alt="logo"></a>

        <nav aria-label="Main">

                <legend>Contact Details</legend>
                <form id="contact-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" minlength="5" max="25" placeholder="Full name" required>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Email@example.com" required>
                    <label for="subject">Subject</label>

                        <option>Example reason 1</option>

                        <option>Example reason 3</option>
                    </select>


                </form>
            </fieldset>
        </section>
